---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: models.llm.example.io
spec:
  group: llm.example.io
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.resolvedRuntime
      name: Runtime
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Model
            properties:
              contextSize:
                default: 4096
                description: ContextSize is the model context window size in tokens.
                format: int32
                minimum: 128
                type: integer
              extraArgs:
                description: |-
                  ExtraArgs are appended verbatim to the engine command line, after the
                  arguments the operator generates. Use it for anything the spec does not
                  expose; arguments the operator already set are not duplicated.
                items:
                  type: string
                type: array
              format:
                default: auto
                description: |-
                  Format is the weight format: "gguf" for llama.cpp, "safetensors" for vLLM.
                  "auto" infers it from Runtime, or from Source when Runtime is "auto".
                enum:
                - auto
                - gguf
                - safetensors
                type: string
              gpu:
                description: |-
                  GPU requests GPU acceleration for the inference server.
                  Setting it at all (even to "{}") is what enables GPU mode: the operator
                  then uses the CUDA image, requests nvidia.com/gpu and offloads Layers
                  layers of the model to the GPU. Leaving it nil runs the CPU engine.
                properties:
                  count:
                    default: 1
                    description: |-
                      Count is the number of GPUs requested as nvidia.com/gpu.
                      Only 1 is supported today; a larger value is rejected by the CRD.
                    format: int32
                    maximum: 1
                    minimum: 1
                    type: integer
                  layers:
                    default: 99
                    description: |-
                      Layers is the number of model layers offloaded to the GPU,
                      passed to llama.cpp as --n-gpu-layers. 99 offloads every layer of the
                      small models this operator targets.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              image:
                description: |-
                  Image is the container image of the inference server.
                  When empty, the operator picks the engine image from the backend
                  (llama.cpp today) and from whether the Model asks for a GPU.
                type: string
              replicas:
                default: 1
                description: |-
                  Replicas is the desired number of inference Pods.
                  Set to 0 to scale the Deployment down to zero replicas.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources sets CPU and memory requests and limits for
                  the inference container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtime:
                default: auto
                description: |-
                  Runtime selects the inference engine: "llamacpp" (GGUF weights) or "vllm"
                  (safetensors weights from the Hugging Face Hub). "auto" leaves the choice
                  to the operator, which infers it from Format and Source; the decision is
                  reported in status.resolvedRuntime and never written back to the spec.
                enum:
                - auto
                - llamacpp
                - vllm
                type: string
              runtimeClassName:
                description: |-
                  RuntimeClassName is the RuntimeClass of the inference Pod, for example
                  "nvidia". When empty and GPU mode is enabled, the operator falls back to
                  the GPU_RUNTIME_CLASS environment variable of its own Deployment, and then
                  to no RuntimeClass at all (the cluster default).
                type: string
              source:
                description: |-
                  Source is the HTTPS download URL for GGUF model weights.
                  The controller validates that the parsed URL uses HTTPS and that the
                  path ends with ".gguf"; query strings such as "?download=true" are allowed.
                  Quantization is determined by the GGUF file referenced in the URL.
                minLength: 1
                type: string
            required:
            - source
            type: object
            x-kubernetes-validations:
            - message: vllm does not support gguf in this operator
              rule: '!(self.runtime == ''vllm'' && self.format == ''gguf'')'
            - message: llamacpp requires gguf
              rule: '!(self.runtime == ''llamacpp'' && self.format == ''safetensors'')'
          status:
            description: status defines the observed state of Model
            properties:
              cacheKey:
                description: |-
                  CacheKey 缓存目录名，等于 sha256(spec.source) 的前 12 个十六进制字符。
                  模型文件位于缓存根目录下 <CacheKey>/ 子目录，便于到宿主机上定位文件。
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint 集群内 OpenAI 兼容接口地址
                type: string
              observedGeneration:
                description: ObservedGeneration 已处理的 spec 版本，用于判断 status 是否过期
                format: int64
                type: integer
              phase:
                description: 'Phase 人类可读的状态概览: Pending / Deploying / Ready / Failed'
                type: string
              readyReplicas:
                description: ReadyReplicas 就绪副本数
                format: int32
                type: integer
              resolvedFormat:
                description: 'ResolvedFormat 实际使用的权重格式: gguf / safetensors'
                type: string
              resolvedRuntime:
                description: 'ResolvedRuntime 实际使用的推理后端: llamacpp / vllm'
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
